# Isolated local Redis for API cache and BullMQ. No cloud quota is consumed.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', 'redispass']
    volumes:
      - trialex_dev_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redispass', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  trialex_dev_redis:
